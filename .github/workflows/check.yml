name: Check stock alerts

on:
  schedule:
    # Every 5 min, Sun–Fri UTC. The script itself skips when no session is open
    # (Fri 8pm ET – Sun 8pm ET), so this covers pre/regular/after-hours and overnight.
    - cron: "*/5 * * * 0-5"
  workflow_dispatch:
    inputs:
      force_session:
        description: "Test a session's price source now (day / overnight); blank = normal"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: stock-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check prices
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FORCE_SESSION: ${{ inputs.force_session }}
        run: |
          if [ -n "$FORCE_SESSION" ]; then python3 stock_alerts.py price AAPL NVDA; fi
          python3 stock_alerts.py check
      - name: Save fired/re-armed state
        run: |
          if ! git diff --quiet alerts.json; then
            git config user.name "stock-alerts-bot"
            git config user.email "stock-alerts-bot@users.noreply.github.com"
            git commit -am "Update alert state"
            git pull --rebase && git push
          fi
